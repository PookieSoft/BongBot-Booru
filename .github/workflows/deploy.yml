name: Create Release and Deploy BongBot-Booru

# Builds the Docker image and publishes the library to GitHub Packages.

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: read
    packages: write

jobs:
    release:
        uses: PookieSoft/workflows/.github/workflows/release.yml@v1
        with:
            runtime: node
            build-docker: true
            docker-image-name: bongbot-booru
            publish-package: true
            codecov-slug: PookieSoft/BongBot-Booru
            environment: Prod
        secrets: inherit
